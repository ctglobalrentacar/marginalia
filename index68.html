<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Marginalia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: dark, single phone-width column. Home leads with a big "up next" card tinted by the book's colour, then poster rails. Floating pill nav, search circle and add button sit over the content. */
:root{
  color-scheme:dark;
  --bg:#0A0912; --surface:#15131F; --surface2:#1E1B2E; --line:#2B2740; --ink:#F3F1FA; --muted:#9C97B3;
  --violet:#A855F7; --indigo:#6366F1; --cyan:#38BDF8; --green:#34D399; --amber:#FACC15; --pink:#F472B6; --red:#F87171;
  --gh:268; --on:#fff; --fab1:#7C3AED; --fab2:#6366F1;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
/* themes: pick one in Profile > menu > Settings */
:root[data-theme=ocean]{--bg:#070D14;--surface:#0F1822;--surface2:#162331;--line:#223244;--ink:#EAF3FA;--muted:#8EA4B8;--violet:#38BDF8;--indigo:#0EA5E9;--cyan:#7DD3FC;--gh:200;--on:#06222b;--fab1:#0EA5E9;--fab2:#38BDF8}
:root[data-theme=forest]{--bg:#070F0C;--surface:#0E1914;--surface2:#15251D;--line:#213A2E;--ink:#EAF6EF;--muted:#8DAA9A;--violet:#34D399;--indigo:#10B981;--cyan:#6EE7B7;--gh:155;--on:#05241a;--fab1:#10B981;--fab2:#34D399}
:root[data-theme=amber]{--bg:#100E0C;--surface:#1A1714;--surface2:#242019;--line:#322C25;--ink:#F6EFE4;--muted:#A99F90;--violet:#E3A15A;--indigo:#C77B3E;--cyan:#F0C48A;--gh:32;--on:#1b1208;--fab1:#C77B3E;--fab2:#E3A15A}
:root[data-theme=rose]{--bg:#120A0E;--surface:#1D1217;--surface2:#2A1A22;--line:#3D2530;--ink:#FAEFF3;--muted:#B396A1;--violet:#F472B6;--indigo:#EC4899;--cyan:#F9A8D4;--gh:335;--on:#2a0a18;--fab1:#EC4899;--fab2:#F472B6}
.thm{display:flex;gap:10px;flex-wrap:wrap}
.thm button{display:grid;justify-items:center;gap:6px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:2px;min-width:56px}
.thm i{width:42px;height:42px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);background:linear-gradient(135deg,var(--s1),var(--s2))}
.thm button[aria-pressed=true]{color:var(--ink)}
.thm button[aria-pressed=true] i{border-color:var(--bg);box-shadow:0 0 0 2px var(--s1)}
/* nav bar style: Settings > Navigation bar (solid is the default) */
:root[data-nav=glass] .pill,:root[data-nav=glass] .circle{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),color-mix(in srgb,var(--surface) 46%,transparent);
 -webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);border:1px solid rgba(255,255,255,.2);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.38)}
:root[data-nav=glass] .pill button{color:color-mix(in srgb,var(--ink) 80%,transparent);text-shadow:0 1px 6px rgba(0,0,0,.35)}
:root[data-nav=glass] .pill button[aria-current="page"]{color:var(--violet)}
:root[data-nav=glass] .pind{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.14),0 2px 8px rgba(0,0,0,.25)}
:root[data-nav=glass] .fab{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.12),0 12px 26px -6px color-mix(in srgb,var(--fab2) 75%,transparent)}
*{box-sizing:border-box}
body{
  background:radial-gradient(120% 460px at 50% -60px,hsl(var(--gh) 65% 21% / .9),transparent 72%) no-repeat,var(--bg);
  color:var(--ink);font:15px/1.4 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 190px;min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.plain{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;color:inherit;width:100%}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:14px 6px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:19px;text-transform:uppercase}
.brand b{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot[data-s="cloud"]{background:var(--green)}.dot[data-s="err"]{background:var(--red)}
.pagetitle{font-size:26px;font-weight:700;margin:0}
.kind{display:flex;gap:2px;padding:4px;border-radius:999px;border:2px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,var(--violet),var(--cyan)) border-box}
.kind button{border:0;background:none;color:var(--muted);height:36px;min-width:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:0 10px;cursor:pointer;font-size:14px}
.kind button[aria-pressed="true"]{background:var(--violet);color:var(--on)}
/* compact filter switch: stays on the same row as the logo even with a label open */
.kind{padding:3px;flex:none}
.kind button{height:30px;min-width:34px;padding:0 8px;font-size:13px;gap:5px}
.kind button .ic{font-size:17px;width:17px;height:17px}
.top:has(.kind){flex-wrap:nowrap}
.top:has(.kind) .brand{min-width:0;font-size:17px;letter-spacing:.1em;gap:8px}
@media (max-width:380px){.top:has(.kind) .brand{font-size:15px;letter-spacing:.06em;gap:6px}.kind button{padding:0 7px}}
@media (max-width:350px){.top:has(.kind) .brand .dot{display:none}}

/* section headings */
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.sh::before{content:"";width:4px;height:22px;border-radius:4px;background:var(--violet);flex:none}
.sh h2{margin:0;font-size:17px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.sh small{color:var(--muted);font-size:14px}
.sh .count{background:var(--indigo);color:var(--on);border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}
.note{color:var(--muted);font-size:13px;margin:-6px 0 12px}

/* covers */
.cover{aspect-ratio:2/3;width:100%;border-radius:4px 10px 10px 4px;color:hsl(var(--h) 70% 95%);padding:11% 9% 9% 17%;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;
  background:linear-gradient(90deg,rgba(0,0,0,.32) 0 6%,rgba(255,255,255,.14) 6% 8%,transparent 8%),hsl(var(--h) 42% 30%);
  box-shadow:0 2px 4px rgba(0,0,0,.4),0 10px 20px -10px rgba(0,0,0,.7)}
.cover.v1{background:linear-gradient(90deg,rgba(0,0,0,.32) 0 6%,rgba(255,255,255,.14) 6% 8%,transparent 8%),linear-gradient(transparent 72%,hsla(var(--h),70%,72%,.28) 72%),hsl(var(--h) 42% 30%)}
.cover.v2{background:linear-gradient(90deg,rgba(0,0,0,.32) 0 6%,rgba(255,255,255,.14) 6% 8%,transparent 8%),radial-gradient(circle at 82% 88%,hsla(var(--h),80%,76%,.32) 0 24%,transparent 25%),hsl(var(--h) 42% 30%)}
.cover.img{padding:0;background:#000}
.cover.img img{width:100%;height:100%;object-fit:cover;display:block}
.ct{font-family:var(--serif);font-weight:600;line-height:1.08;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow-wrap:anywhere}
.ca{font-size:.62em;opacity:.8;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.au-hero{position:relative;overflow:hidden;border-radius:22px;padding:12px 14px 16px;display:grid;gap:10px;justify-items:center;text-align:center;background:linear-gradient(160deg,hsl(var(--h) 45% 26%),#14112200 85%),#16132A;isolation:isolate}
.au-hero .au-bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) saturate(1.2);opacity:.5;z-index:-1}
.au-hero .sh-top{width:100%}
.au-hero .au-av{width:104px;height:104px;font-size:34px;border:3px solid rgba(255,255,255,.85);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.au-name{margin:0;font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.au-stats{display:flex;width:100%;border-radius:999px;padding:2px;background:linear-gradient(90deg,var(--cyan,#22D3EE),var(--violet),#F472B6)}
.au-stats>div{flex:1;display:grid;justify-items:center;gap:1px;padding:8px 6px;background:#12101F}
.au-stats>div:first-child{border-radius:999px 0 0 999px}.au-stats>div:last-child{border-radius:0 999px 999px 0}.au-stats>div+div{border-left:1px solid var(--line)}
.au-stats b{font-size:18px}.au-stats span{font-size:11.5px;color:var(--muted)}
.au-bh{display:flex;align-items:center;gap:10px;margin:16px 0 10px}.au-bh h3{margin:0;font-size:19px}.au-bh .by{margin:0}
.au-sortb{margin-left:auto;display:inline-flex;align-items:center;gap:4px}.au-sortb .ic{width:16px;height:16px;transform:rotate(90deg)}
.au-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:10px 0 14px}
.au-row .pw{display:block;width:92px}.au-row .cover{width:92px}
.au-info{display:flex;flex-direction:column;gap:3px;min-width:0}.au-info .t{font-size:17px}
.au-act{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap}.au-act .grow{flex:1 1 130px}
.fmtrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fmtcell{display:grid;justify-items:center;gap:4px;padding:12px 6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink);min-height:44px}.fmtcell:disabled{opacity:.45;cursor:default}.fmtcell .fi .ic{width:26px;height:26px}.fmtcell b{font-size:13px;color:var(--muted);font-weight:600}
.tpage{position:fixed;inset:0;z-index:410;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:radial-gradient(ellipse at 50% 24%,hsl(var(--h) 42% 40%) 0,hsl(var(--h) 46% 19%) 58%,#0A0912 100%)}
.tpage[hidden]{display:none}
.tp-top{width:100%;display:flex;justify-content:space-between;align-items:center}
.tp-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}.tp-x .ic{width:22px;height:22px}
.tp-done{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.tp-art{margin-top:5vh;width:min(46vw,200px)}.tp-art .cover{box-shadow:0 18px 40px rgba(0,0,0,.5)}
.tp-title{margin:16px 0 0;font-family:var(--serif);font-size:20px;text-align:center;max-width:90%;overflow-wrap:anywhere}
.tp-time{font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:22px;letter-spacing:.01em}
.tp-pause{width:78px;height:78px;border-radius:50%;background:#fff;color:#241a2e;border:0;display:grid;place-items:center;margin-top:18px}.tp-pause .ic{width:34px;height:34px}
.tp-qn{margin-top:auto;display:flex;gap:28px;justify-content:center;width:100%;padding-top:12px}
.tp-qb{display:grid;justify-items:center;gap:8px;background:none;border:0;color:#fff;font-size:13px;font-weight:600}.tp-qb i{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal}.tp-qb .ic{width:26px;height:26px}
.tp-comp{position:absolute;left:0;right:0;bottom:0;background:#17131f;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:12px;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.tp-comp h4{margin:0;display:flex;align-items:center;gap:10px;font-size:17px}.tp-comp textarea{width:100%;min-height:130px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:12px;font:inherit;font-size:16px;resize:vertical}
.tp-saved{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:rgba(255,255,255,.18);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}
.tbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;color:inherit;background:none;border:0}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;margin-bottom:12px}
.qh{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.qh .cover{width:36px}
.qtype{color:var(--violet);display:inline-flex}.qtype .ic{width:22px;height:22px}
.qtx{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.45}.qtx.q{font-family:var(--serif);font-size:17px}
.qf{display:flex;align-items:center;gap:6px}.qf .ib{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center}.qf .ib .ic{width:20px;height:20px}.qf .ib[aria-pressed="true"]{color:#F472B6}.qf .ib[aria-pressed="true"] .ic{fill:currentColor}.qf .sp{flex:1}
.takebooks{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.takebooks::-webkit-scrollbar{display:none}.takebooks .tb{flex:none;width:72px}
.cover.xs{font-size:7px}.cover.xs .ct{font-size:9px;-webkit-line-clamp:4}.cover.xs .ca{display:none}
.cover.sm{font-size:11px}.cover.sm .ct{font-size:13px}
.cover.md{font-size:13px}.cover.md .ct{font-size:15px}
.cover.lg{font-size:16px}.cover.lg .ct{font-size:21px}

.ri,.dc,.gitem,.pk{min-width:0}
.ri,.dc,.gitem{grid-template-columns:minmax(0,1fr)}
.ri>*,.dc>*,.gitem>*{min-width:0;max-width:100%}
.cover{min-width:0;max-width:100%}
.ct{max-width:100%}
.btn .ic{vertical-align:-3px}
.timerbar{position:absolute;left:0;right:76px;bottom:76px;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--cyan);border-radius:20px;padding:8px 8px 8px 14px;backdrop-filter:blur(14px);pointer-events:auto;min-width:0}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.tdot.on{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tdot.on{animation:none}}
.tmain{display:grid;min-width:0;flex:1}
.tmain b{font-size:20px;line-height:1.1}
.ttl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h3{margin:0;font-size:20px}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;padding:0}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd span{text-align:center;color:var(--muted);font-size:13px;padding:4px 0}
.cal-cell{position:relative;display:block;aspect-ratio:2/3;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);padding:0;overflow:hidden;color:var(--muted);text-align:left;min-width:0}
.cal-cell.blank{border:0;background:none}
.cal-cell .dn{position:absolute;top:4px;left:6px;z-index:3;font-weight:600;font-size:12px;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.9)}
button.cal-cell{cursor:pointer;border-color:transparent}
.cal-cell.today{box-shadow:0 0 0 2px var(--cyan)}
.cal-cell .cover{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none;padding:18% 8% 8% 14%}
.cal-cell .cover .ct{font-size:6px;-webkit-line-clamp:6}
.cal-cell .cover .ca{display:none}
.cal-more{position:absolute;right:3px;bottom:3px;z-index:3;background:rgba(0,0,0,.72);color:#fff;border-radius:8px;font-size:11px;font-weight:700;padding:1px 6px}
.rc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;background:transparent}
.avwrap{position:relative;flex:none}
.avedit{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);background:var(--cyan);color:#06222F;display:grid;place-items:center;cursor:pointer;padding:0}
.avedit .ic{font-size:15px}
.bnbtn{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.online-note{color:var(--muted);font-size:12px;margin:10px 0 0}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px;padding-top:calc(min(63%,285px) + 44px);border:1px solid hsl(var(--h) 70% 42% / .7);
  background:radial-gradient(110% 80% at 85% 5%,hsl(var(--h) 72% 36%),hsl(var(--h) 62% 13%) 68%),#000}
.hero{isolation:isolate}
.hero-au{position:absolute;top:0;right:0;width:68%;height:70%;z-index:0;pointer-events:none;object-fit:cover;object-position:center 15%;mix-blend-mode:luminosity;opacity:.58;filter:grayscale(1) contrast(1.08);-webkit-mask-image:linear-gradient(to left,#000 28%,transparent 100%),linear-gradient(to bottom,#000 55%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to left,#000 28%,transparent 100%),linear-gradient(to bottom,#000 55%,transparent 100%);mask-composite:intersect}
.hero-open{position:absolute;inset:0;z-index:1;background:none;border:0;cursor:pointer;border-radius:26px}
.hero-art{position:absolute;top:22px;right:22px;width:42%;max-width:190px;transform:rotate(3deg)}
.tag{position:absolute;top:0;right:0;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:0 26px 0 22px;font-weight:800;letter-spacing:.06em;font-size:16px;color:#06251A;background:var(--green)}
.tag.want{background:var(--violet);color:var(--on)}
.hero-body{position:relative;z-index:2;display:grid;gap:8px;pointer-events:none}
.hero-body button{pointer-events:auto}
.hero h3{font-family:var(--serif);font-size:30px;line-height:1.05;margin:0;font-weight:600;letter-spacing:-.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .meta{margin:0;color:rgba(255,255,255,.82);font-size:15px}
.segwrap{position:relative;padding-top:34px;margin-top:4px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.segs span{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.segs span i{display:block;height:100%;background:var(--green)}
.segs span.cur i{background:var(--violet)}
.segbadge{position:absolute;top:0;transform:translateX(-50%);background:linear-gradient(90deg,var(--violet),var(--indigo));color:var(--on);border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}

var ref=null,col=null,me=null,syncMode='local',syncErr=false,userEdited=false,dirty=false,saveTimer=null,saving=Promise.resolve();
function syncState(){return syncErr?'err':(syncMode==='cloud'?'cloud':'local');}
function paintSync(){
  var el=$('#syncdot'); if(el){el.dataset.s=syncState();el.title=t(syncState()==='cloud'?'syncCloud':(syncState()==='err'?'syncErr':'syncLocal'));}
  var el2=$('#syncText'); if(el2)el2.textContent=t(syncState()==='cloud'?'syncCloud':(syncState()==='err'?'syncErr':'syncLocal'));
}
function flush(){
  if(!dirty||!ref)return Promise.resolve();
  dirty=false;
  return ref.set(clone(state)).then(function(){syncErr=false;paintSync();},function(){syncErr=true;paintSync();});
}
function persist(){
  userEdited=true; state.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  if(!ref)return;
  dirty=true; clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){saving=saving.then(flush);},700);
}

function initCloud(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(user){user.me().then(function(m){me=m;if(view.tab==='profile')renderMain();},function(){});}
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      var c=db.collection('data/users/'+id),d=c.doc('library');
      var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},10000);});
      return Promise.race([d.get(),timeout]).then(function(snap){
        ref=d;col=c;syncMode='cloud';
        if(snap.exists&&!userEdited){
          var data=snap.data();
          if(data&&Array.isArray(data.books)){
            state=normalize(clone(data));
            try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
            var jobs=state.books.filter(function(b){return b.hasCover&&!covers[b.id];}).map(function(b){
              return c.doc('cover_'+b.id).get().then(function(s){if(s.exists&&s.data()&&s.data().d){covers[b.id]=s.data().d;try{localStorage.setItem('marginalia.cover.'+b.id,covers[b.id]);}catch(e){}}});
            });
            Promise.all(jobs).catch(function(){}).then(function(){renderAll();});
            renderAll();
          }
        }else{
          dirty=true;saving=saving.then(flush);
          state.books.forEach(function(b){if(b.hasCover&&covers[b.id])c.doc('cover_'+b.id).set({d:covers[b.id]}).catch(function(){});});
        }
        paintSync();
      });
    });
  }).catch(function(){syncMode='local';paintSync();});
}

function lastAct(b){
  var m=0,i;
  for(i=0;i<state.logs.length;i++){var l=state.logs[i];if(l.bid===b.id){var v=new Date(l.d+'T12:00:00').getTime();if(v>m)m=v;}}
  for(i=0;i<state.events.length;i++){var e=state.events[i];if(e.bid===b.id&&e.t>m)m=e.t;}
  if(!m&&b.startedAt)m=new Date(b.startedAt+'T12:00:00').getTime();
  return m||b.addedAt||0;
}
function queue(){

  return rd.concat(wt);
}
function pagesByDay(){var m={};state.sessions.forEach(function(s){m[s.d]=(m[s.d]||0)+s.p;});return m;}
function streak(){var m=pagesByDay(),i=m[dayOffset(0)]>0?0:1,n=0;while(m[dayOffset(i)]>0){n++;i++;}return n;}
function pace(){var m=pagesByDay(),s=0;for(var i=0;i<14;i++)s+=m[dayOffset(i)]||0;return s/14;}
function etaDays(b){var rem=b.pages-b.page,p=pace();if(b.status!=='reading'||p<1||rem<=0)return null;return Math.ceil(rem/p);}
function etaText(b){var d=etaDays(b);if(d==null)return '';return d<=1?t('etaDay'):(d>60?t('etaMonths'):t('etaDays',{n:d}));}
function pct(b){return b.pages?Math.round(b.page/b.pages*100):0;}
function tkey(x){
  var c=cleanTitle(x).replace(/\s*[:\-–—]\s*(a|an)\s+(novel|memoir|thriller|mystery|story|romance|tale|saga)\b.*$/i,'');
  return norm(c).replace(/^(the|a|an|el|la|los|las|un|una)\s+/,'');
}
function inLib(cid,en,author){
  var c0=cid?CATBY[cid]:null;
  if(c0){en=en||c0.en;author=author||c0.author;}
  var keys=[],na=norm(String(author||'').split(',')[0]).split(' ').pop();
  if(c0){keys.push(tkey(c0.en));if(c0.es)keys.push(tkey(c0.es));}
  if(en){keys.push(tkey(en));var oe=origTitleFor(en,author);if(oe)keys.push(tkey(oe));}
  return state.books.filter(function(b){
    if(cid&&b.cid===cid)return true;
    if(en&&String(b.title).trim().toLowerCase()===String(en).trim().toLowerCase()&&String(b.author).trim().toLowerCase()===String(author).trim().toLowerCase())return true;
    if(!na||norm(authorOf(b)).indexOf(na)<0)return false;
    var bk=[b.title,metaTitle(b),b.orig].filter(Boolean).map(tkey);
    return keys.some(function(k){return k&&bk.indexOf(k)>=0;});
  })[0];
}

/* ================= mutations ================= */
function logEvent(type,b,v){
  var now=Date.now(),L=state.events;
  if(type==='pages'){
    var last=L[0];
    if(last&&last.type==='pages'&&last.bid===b.id&&now-last.t<3600000&&new Date(last.t).toDateString()===new Date(now).toDateString()){last.v+=v;last.t=now;return;}
  }
  L.unshift({t:now,type:type,bid:b.id,v:v||0}); if(L.length>300)L.length=300;
}
function progDay(){return (view.pgDay&&view.pgDay<=dayOffset(0))?view.pgDay:dayOffset(0);}
function logPages(delta,b,day){
  if(b)logDay(b,delta,0,day);
  var d=day||dayOffset(0),s=state.sessions.filter(function(x){return x.d===d&&!x.sample;})[0];
  if(delta>0){if(!s){s={d:d,p:0};state.sessions.push(s);}s.p+=delta;}
  else if(s){s.p=Math.max(0,s.p+delta);if(s.p===0)state.sessions=state.sessions.filter(function(x){return x!==s;});}
}
function setPage(b,n){
  n=Math.max(0,Math.min(b.pages,Math.round(Number(n)||0)));
  var delta=n-b.page; if(delta===0)return false;
  var d=progDay(),finishedNow=false,wasStatus=b.status;
  logPages(delta,b,d); b.page=n;
  if(delta>0&&b.startedAt&&d<b.startedAt)b.startedAt=d;
  if(delta>0)logEvent('pages',b,delta);
  if(n>0&&(b.status==='want'||b.status==='dropped')){b.status='reading';if(wasStatus==='want'){b.startedAt=d;logEvent('started',b);}}
  if(n>=b.pages){if(b.status!=='finished'){finishedNow=true;logEvent('finished',b);}b.status='finished';b.finishedAt=d;}
  else if(b.status==='finished'){b.status='reading';b.finishedAt=null;}
  persist(); return finishedNow;
}
function setStatus(b,s){
  if(s===b.status)return; var d=dayOffset(0),prev=b.status;
  if(s==='finished'){if(prev==='reading')logPages(b.pages-b.page,b);b.page=b.pages;b.finishedAt=d;if(!b.startedAt)b.startedAt=d;logEvent('finished',b);}
  else if(prev==='finished'){b.finishedAt=null;b.page=0;}
  if(s==='reading'&&(prev==='want'||prev==='finished')){b.startedAt=d;logEvent('started',b);}
  b.status=s; persist();
}

/* ---- upcoming releases ---- */
function upParse(r){
  r=String(r||'');var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(r),n=/^(\d{4})-(\d{2})$/.exec(r);
  if(m)return {iso:r,exact:true};
  if(n)return {iso:r+'-01',exact:false,ym:r};
  return null;
}
function upInfo(r){
  var p=upParse(r);if(!p)return null;
  var today=dayOffset(0),future,days;
  if(p.exact){future=p.iso>=today;days=Math.round((new Date(p.iso+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);}
  else{future=p.ym>=today.slice(0,7);days=Math.round((new Date(p.iso+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);}
  return {p:p,future:future,days:days,out:!future};
}
function upSoon(r){var i=upInfo(r);return !!(i&&i.future&&(i.p.exact?i.days>0:true));}
function upCountdown(i){
  if(!i.p.exact&&i.days<=0)return t('upThisMonth');
  if(!i.p.exact){var mo0=Math.round(i.days/30.4);return mo0<=1?t('upInMonth'):t('upInMonths',{n:mo0});}
  if(i.days<=0)return t('upToday');if(i.days===1)return t('upTomorrow');
  if(i.days<14)return t('upInDays',{n:i.days});
  if(i.days<70)return t('upInWeeks',{n:Math.round(i.days/7)});
  var mo=Math.round(i.days/30.4);return mo<=1?t('upInMonth'):t('upInMonths',{n:mo});
}
function upDateTxt(i){
  if(i.p.exact)return t('upRelOn',{d:fmtDay(i.p.iso,{month:'short',day:'numeric',year:'numeric'})});
  return t('upExpect',{d:new Date(i.p.iso+'T00:00:00').toLocaleDateString(lang(),{month:'long',year:'numeric'})});
}
function upAll(){return state.upw||(state.upw=[]);}
function upWatched(k){return upAll().some(function(x){return x.k===k;});}
function upKeyOf(b){return b.id&&String(b.id).indexOf('ext:')===0?String(b.id).slice(4):'b:'+b.id;}
function upBlk(b,inf){
  var rel=b.rel||(inf&&inf.published)||'',i=upInfo(rel);
  if(!i||!i.future||(i.p.exact&&i.days<0))return '';
  var k=upKeyOf(b),w=upWatched(k);
  return '<section class="blk up-blk"><div class="up-top"><span class="up-badge">'+esc(t('upSoon'))+'</span><b class="tnum">'+esc(upCountdown(i))+'</b></div><p class="by" style="margin:0">'+esc(upDateTxt(i))+'</p>'
   +'<div class="quick"><button class="btn'+(w?'':' primary')+'" data-a="up-watch" aria-pressed="'+w+'">'+esc(w?'✓ '+t('upWatching'):t('upNotify'))+'</button>'+(i.p.exact?'<button class="btn" data-a="up-cal">'+esc(t('upCal'))+'</button>':'')+'</div>'
   +'<p class="meta" style="margin:0;font-size:12px">'+esc(t('upNote'))+'</p></section>';
}

  if(sh.type==='ext'){var it=extItem(sh);if(!it)return null;var b=extBook(it),m=metaC[b.id],inf=(m&&m.info)||{};return {b:b,inf:inf,it:it};}

/* Google Books thumbnails are tiny (~128px). When one is shown bigger than its pixels, quietly test a larger version and swap only if it really is larger (the 'image not available' placeholder is never bigger). */
var hiTried={};

  var el=e.target;

/* one cover: your own photo, else the online cover on top of a generated one (which shows if the image fails), else generated */
/* last-resort cover: Apple Books (iTunes Search API), only for books no other source has a cover for; remembered on this device */
var APLK='marginalia.apc',apc={},apQ=[],apBusy=false,apSeen={},apFail=0,apN=0;
try{apc=JSON.parse(localStorage.getItem(APLK)||'{}')||{};}catch(e){apc={};}
function apKey(title,author){return norm(cleanTitle(title))+'|'+norm(String(author||'').split(',')[0]).split(' ').pop();}
function apSave(){try{var ks=Object.keys(apc);if(ks.length>600)ks.slice(0,ks.length-600).forEach(function(k){delete apc[k];});localStorage.setItem(APLK,JSON.stringify(apc));}catch(e){}}
function appleCoverFor(title,author){
  if(!title)return '';
  var k=apKey(title,author);
  if(apc[k]!==undefined)return apc[k];
  if(!apSeen[k]&&apFail<3&&apQ.length<40){apSeen[k]=1;apQ.push({k:k,title:cleanTitle(title),author:String(author||'').split(',')[0].trim()});setTimeout(apPump,50);}
  return '';
}
function apPump(){
  if(apBusy||!apQ.length||apFail>=3||apN>=60)return;
  apBusy=true;apN++;
  var j=apQ.shift(),tk=norm(j.title),ln=norm(j.author).split(' ').pop();
  fetchJSON('https://itunes.apple.com/search?media=ebook&entity=ebook&limit=8&term='+encodeURIComponent(j.title+(j.author?' '+j.author:''))).then(function(d){
    apFail=0;var hit=((d&&d.results)||[]).filter(function(x){
      var tn=norm(cleanTitle(x.trackName||'')),an=norm(x.artistName||'');
      return x.artworkUrl100&&tn&&(tn===tk||tn.indexOf(tk)===0||tk.indexOf(tn)===0)&&(!ln||an.indexOf(ln)>=0);
    })[0];
    apc[j.k]=hit?hit.artworkUrl100.replace(/\/\d+x\d+(bb)?\.(jpg|png)/,'/400x400bb.$2'):'';
    apSave();if(hit)refreshSoon();
  },function(){apFail++;}).then(function(){setTimeout(function(){apBusy=false;apPump();},500);});
}

function calLogs(){
  var map={},out=[];
  function add(d,bid,p,sc,mk){
    var k=d+'|'+bid,e=map[k];
    if(!e){e=map[k]={d:d,bid:bid,p:0,s:0};out.push(e);}
    e.p+=p||0;e.s+=sc||0;if(mk&&!e.mk)e.mk=mk;
  }
  state.logs.forEach(function(l){
    var b=find(l.bid);if(!b)return;
    var d=l.d;
    if(b.status==='finished'&&b.finishedAt&&d>b.finishedAt)d=b.finishedAt;
    add(d,b.id,l.p,l.s);
  });
  state.books.forEach(function(b){
    if(b.status!=='finished'||!b.finishedAt||!(b.pages>0))return;
    var logged=0;out.forEach(function(e){if(e.bid===b.id)logged+=e.p;});
    var rem=b.pages-logged; if(rem<=0)return;
    var days=[],fin=b.finishedAt;
    if(b.startedAt&&b.startedAt<fin){
      var a=b.startedAt.split('-'),dt=new Date(+a[0],+a[1]-1,+a[2]),k=0;
      while(k<400){var ds=iso(dt);days.push(ds);if(ds>=fin)break;dt.setDate(dt.getDate()+1);k++;}
      if(days[days.length-1]!==fin)days=[fin];
    }else days=[fin];
    var each=Math.floor(rem/days.length),extra=rem-each*days.length;
    days.forEach(function(ds,i){add(ds,b.id,each+(i===days.length-1?extra:0),0);});
  });
  state.books.forEach(function(b){
    if(b.status==='want')return;
    if(b.startedAt&&!map[b.startedAt+'|'+b.id])add(b.startedAt,b.id,0,0,'calStart');
    if(b.status==='finished'&&b.finishedAt&&!map[b.finishedAt+'|'+b.id])add(b.finishedAt,b.id,0,0,'calFin');
  });
  return out;
}

function axisMin(m){return m>=60?(m%60?Math.round(m/60*10)/10:m/60)+'h':m+'m';}
function niceMax(m){var st=[15,30,60,90,120,180,240,300,420,600,900,1200];for(var i=0;i<st.length;i++)if(m<=st[i])return st[i];return Math.ceil(m/600)*600;}
function statsHTML(){

  B.forEach(function(b,i){svgh+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(b.v).toFixed(1)+'" r="'+(i===sel?5:2.6)+'" fill="'+(i===sel?'var(--violet)':'var(--cyan)')+'"'+(i===sel?' stroke="var(--bg)" stroke-width="2"':'')+'/>';});
  B.forEach(function(b,i){var w=pw/Math.max(1,n-1);svgh+='<rect x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'" fill="transparent" data-a="stat-pt" data-i="'+i+'" aria-label="'+esc(b.lbl+': '+durText(Math.round(b.v*60)))+'"/>';});

   +'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(t('statsTitle'))+'" style="display:block;touch-action:manipulation"><defs><linearGradient id="chg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--violet)" stop-opacity=".45"/><stop offset="1" stop-color="var(--violet)" stop-opacity="0"/></linearGradient></defs>'+svgh+'</svg>'

function wrapData(y,m){

function wrapLoad(url){

    if(!/^data:|^blob:/.test(url))im.crossOrigin='anonymous';
    im.onload=function(){wrapImgs[url]=im;res(im);};
    im.onerror=function(){wrapImgs[url]=null;res(null);};

}

function csvParse(txt){
  var rows=[],row=[],f='',q=false,i=0,n;
  if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
  for(;i<txt.length;i++){
    var ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n')i++; row.push(f);f=''; if(row.length>1||row[0]!=='')rows.push(row); row=[]; }
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);if(row.length>1||row[0]!=='')rows.push(row);}
  return rows;
}

function startCoverCrop(file,id,back){
  var fr=new FileReader(); fr.onerror=function(){toast(t('toastCoverErr'));};
  fr.onload=function(){
    var im=new Image(); im.onerror=function(){toast(t('toastCoverErr'));};
    im.onload=function(){
      var k=Math.min(1,1800/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.width*k)); cv.height=Math.max(1,Math.round(im.height*k));
      var cx=cv.getContext('2d'); cx.fillStyle='#000'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height);
      var src=cv.toDataURL('image/jpeg',0.92),im2=new Image();
      im2.onerror=function(){toast(t('toastCoverErr'));};
      im2.onload=function(){
        view.crop={kind:'cover',bid:id,back:back,src:src,iw:im2.width,ih:im2.height,img:im2,z:1,ox:0,oy:0,cx:0,cy:0,rot:0,W:0,H:0,s0:1,ar:2/3,outW:480,outH:720};
        openSheet({type:'crop'}); cropInit();
      };
      im2.src=src;
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function cropSave(){
  var c=view.crop; if(!c)return;
  if(c.kind==='cover'){
    var g=cropCoverGeom(c),k=c.outW/c.W,cv0=document.createElement('canvas'); cv0.width=c.outW; cv0.height=c.outH;
    var x0=cv0.getContext('2d'); x0.fillStyle='#000'; x0.fillRect(0,0,c.outW,c.outH);
    x0.translate(c.outW/2+c.cx*k,c.outH/2+c.cy*k); x0.rotate((c.rot||0)*Math.PI/180); x0.scale(g.sc*k,g.sc*k); x0.drawImage(c.img,-c.iw/2,-c.ih/2);
    var bk0=find(c.bid),back0=c.back; if(!bk0){closeSheet();return;}
    saveCover(c.bid,cv0.toDataURL('image/jpeg',0.86)); bk0.hasCover=true; persist(); view.crop=null; refresh(); toast(t('toastCover'));
    openSheet(back0&&back0.type?back0:{type:'book',id:c.bid}); return;
  }
  var cv=document.createElement('canvas'); cv.width=c.outW; cv.height=c.outH;
  var cx=cv.getContext('2d'),sc=c.s0*c.z; cx.fillStyle='#000'; cx.fillRect(0,0,c.outW,c.outH);
  cx.drawImage(c.img,-c.ox/sc,-c.oy/sc,c.W/sc,c.H/sc,0,0,c.outW,c.outH);
  var url=cv.toDataURL('image/jpeg',0.85),isAv=c.kind==='avatar';
  if(c.au){
    authCustom[c.au]=url;
    try{localStorage.setItem(ACK,JSON.stringify(authCustom));}catch(err){delete authCustom[c.au];toast(t('toastCoverErr'));return;}
    var bk1=c.back;view.crop=null;toast(t('toastPhoto'));openSheet(bk1&&bk1.type?bk1:{type:'author',name:c.au});refresh();return;
  }
  try{localStorage.setItem(isAv?'marginalia.avatar':'marginalia.banner',url);}catch(err){toast(t('toastCoverErr'));return;}
  if(isAv)profImg.avatar=url;else profImg.banner=url;
  closeSheet(); toast(t('toastPhoto'));
}

/* ---- shake to pick the next read ---- */
var SK={on:false,phase:'',ids:[],pick:null,last:null,prog:0,prev:null,lastMove:0,lastBump:0,tick:0,busy:false,sensorT:0,gotMotion:false};
var SKK='marginalia.shakeintro';
function skNeedsPerm(){return typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';}
function skEl(){var el=$('#shake');if(!el){el=document.createElement('div');el.id='shake';el.className='shake';el.hidden=true;el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el);}return el;}
function skWants(){return by('want');}
function skShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function skTop(){return '<div class="sk-top"><button class="sk-x" data-a="shake-close" aria-label="'+esc(t('shakeClose'))+'">'+svg('x')+'</button></div>';}
function skPile(){
  SK.ids=skShuffle(skWants()).slice(0,14).map(function(b){return b.id;});
  return SK.ids.map(function(id,i){
    var b=find(id),col=i%4,row=Math.floor(i/4);
    return '<div class="sk-c" data-id="'+id+'" style="left:'+(6+col*22+Math.random()*4)+'%;top:'+(60+row*9+Math.random()*3)+'%;transform:rotate('+Math.round(Math.random()*40-20)+'deg)">'+cover(b,'md')+'</div>';
  }).join('');
}
function skScatter(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduce)return;
  [].forEach.call(document.querySelectorAll('#shake .sk-c'),function(c){
    c.style.left=(2+Math.random()*74)+'%';c.style.top=(8+Math.random()*78)+'%';c.style.transform='rotate('+Math.round(Math.random()*360-180)+'deg) scale('+(.9+Math.random()*.25).toFixed(2)+')';
  });
}
function openShake(){
  if(skWants().length<2){toast(t('shakeNeed'));return;}
  var el=skEl();SK.on=true;SK.last=null;SK.busy=false;el.hidden=false;document.body.style.overflow='hidden';
  window.addEventListener('devicemotion',skMotion);
  var skip=false;try{skip=localStorage.getItem(SKK)==='1';}catch(e){}
  if(skip&&!skNeedsPerm())skPlay();else skIntro();
}
function skIntro(){
  var el=skEl(),never=false;try{never=localStorage.getItem(SKK)==='1';}catch(e){}
  SK.phase='intro';el.className='shake dim';
  el.innerHTML=skTop()+skPile()+'<div class="sk-card">'+svg('phone')+'<h2>'+esc(t('shakeTitle'))+'</h2><button class="btn primary" data-a="shake-go">'+esc(t('shakeGo'))+'</button><button type="button" class="sk-never" data-a="shake-never" aria-pressed="'+never+'"><i></i>'+esc(t('shakeNever'))+'</button></div>';
}
function skPlay(){
  var el=skEl();SK.phase='play';SK.prog=0;SK.prev=null;SK.busy=false;SK.gotMotion=false;clearInterval(SK.tick);clearTimeout(SK.sensorT);
  el.className='shake';
  el.innerHTML=skTop()+skPile()+'<div class="sk-pill"><div class="row1">'+svg('phone')+'<span id="skTxt">'+esc(t('shakeHint'))+'</span></div><div class="sk-bar"><i id="skBar"></i></div></div><button class="sk-pickme" data-a="shake-pickme">'+svg('dice')+esc(t('shakePickMe'))+'</button>';
  SK.tick=setInterval(function(){if(SK.phase!=='play'||SK.busy)return;if(Date.now()-SK.lastBump>450&&SK.prog>0){SK.prog=Math.max(0,SK.prog-.04);skBar();}},200);
  SK.sensorT=setTimeout(function(){if(SK.phase==='play'&&!SK.gotMotion){var tx=$('#skTxt');if(tx)tx.textContent=t('shakeNoSensor');}},3500);
}
function skBar(){var b=$('#skBar');if(b)b.style.width=Math.round(SK.prog*100)+'%';var tx=$('#skTxt');if(tx&&SK.gotMotion)tx.textContent=SK.prog>0?t('shakeKeep'):t('shakeHint');}
function skMotion(e){
  if(!SK.on||SK.busy||(SK.phase!=='play'&&SK.phase!=='reveal'))return;
  var a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
  SK.gotMotion=true;
  var x=a.x||0,y=a.y||0,z=a.z||0,p=SK.prev;SK.prev={x:x,y:y,z:z};if(!p)return;
  var d=Math.abs(x-p.x)+Math.abs(y-p.y)+Math.abs(z-p.z);
  if(SK.phase==='reveal'){if(d>30&&Date.now()-SK.revealAt>1600)skReveal();return;}
  if(d>16){
    var now=Date.now();SK.lastBump=now;
    if(now-SK.lastMove>140){SK.lastMove=now;skScatter();}
    SK.prog=Math.min(1,SK.prog+Math.min(d,45)/380);skBar();
    if(SK.prog>=1)skReveal();
  }
}
function skPickMe(){
  if(SK.phase!=='play'||SK.busy)return;SK.busy=true;
  var n=0,tx=$('#skTxt');if(tx)tx.textContent=t('shakeKeep');
  var iv=setInterval(function(){
    n++;skScatter();SK.prog=Math.min(1,n/8);skBar();
    if(n>=8||!SK.on||SK.phase!=='play'){clearInterval(iv);if(SK.on&&SK.phase==='play')skReveal();}
  },170);
}
function skReveal(){
  var w=skWants();if(!w.length){skClose();return;}
  var pool=w.length>1?w.filter(function(b){return b.id!==SK.last;}):w,b=pool[Math.floor(Math.random()*pool.length)];
  SK.pick=b.id;SK.last=b.id;SK.phase='reveal';SK.revealAt=Date.now();SK.busy=false;clearInterval(SK.tick);clearTimeout(SK.sensorT);
  try{if(navigator.vibrate)navigator.vibrate([40,30,70]);}catch(e){}
  var cols=['#A855F7','#38BDF8','#F472B6','#FACC15','#34D399','#6366F1'],conf='';
  for(var i=0;i<44;i++)conf+='<span class="sk-conf" style="left:'+Math.round(Math.random()*100)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(2.2+Math.random()*2.4).toFixed(2)+'s;animation-delay:'+(Math.random()*.9).toFixed(2)+'s"></span>';
  var el=skEl();el.className='shake';
  el.innerHTML='<div class="sk-rays"></div>'+conf+skTop()
   +'<div class="sk-res"><div class="kick">'+esc(t('shakeYour').toUpperCase())+'</div><div class="sk-big">'+cover(b,'lg')+'</div><h2>'+esc(titleOf(b))+'</h2><div class="by">'+esc(authorOf(b))+'</div><div class="hint">'+esc(t('shakeAgainHint'))+'</div>'
   +'<div class="sk-btns"><button class="btn glassb" data-a="shake-again">'+svg('dice')+' '+esc(t('shakeTry'))+'</button><button class="btn primary" data-a="shake-open">'+esc(t('shakeOpen'))+'</button></div></div>';
}
function skClose(){
  SK.on=false;SK.phase='';SK.busy=false;clearInterval(SK.tick);clearTimeout(SK.sensorT);window.removeEventListener('devicemotion',skMotion);
  var el=$('#shake');if(el){el.hidden=true;el.innerHTML='';}

function placePind(instant){
  var pl=$('#pill');if(!pl||!pind)return;
  var cur=pl.querySelector('[aria-current="page"]');
  var first=pind.classList.contains('noanim')&&!pind.style.width;
  function settle(){if(first||instant){pind.classList.add('noanim');void pind.offsetWidth;requestAnimationFrame(function(){requestAnimationFrame(function(){pind.classList.remove('noanim');});});}}
  if(!cur){pind.style.opacity='0';settle();return;}
  var w=cur.offsetWidth;if(!w){settle();return;}
  void pind.offsetWidth;
  pind.style.opacity='1';pind.style.width=w+'px';pind.style.height=cur.offsetHeight+'px';
  pind.style.transform='translate('+cur.offsetLeft+'px,'+cur.offsetTop+'px)';
  settle();
}

    case 'tp-comp': TP.comp=QT.indexOf(d.v)>=0?d.v:'quote'; renderTimerPage(); break;
    case 'tp-comp-x': TP.comp=null; renderTimerPage(); break;
    case 'tp-save':
      var tpo=getTimer(),tpb=tpo&&find(tpo.bid),tpt=$('#tpText'); if(!tpb||!tpt)break;
      if(!tpt.value.trim()){toast(t('qnNeedText'));break;}
      var tpp=$('#tpPage'); qnAdd(tpb.id,TP.comp||'quote',tpt.value,tpp?parseInt(tpp.value,10):null);
      TP.comp=null;TP.saved=1;renderTimerPage(); break;
    case 'qn-filter': view.nf=d.v; renderMain(); break;
    case 'qn-fav': var qf=qnFind(d.id); if(qf){qf.fav=!qf.fav;persist();renderMain();} break;
    case 'qn-goto': view.tab='track'; view.sub='notes'; view.nf='all'; view.nq=''; closeSheet(); renderMain(); window.scrollTo(0,0); break;
    case 'qn-new': if(b){view.qnDel=null;openSheet({type:'qnote',bid:b.id,type0:'quote',back:view.sheet&&view.sheet.type==='book'?view.sheet:null});} break;
    case 'qn-edit': if(qnFind(d.id)){view.qnDel=null;openSheet({type:'qnote',id:d.id,back:view.sheet&&view.sheet.type==='book'?view.sheet:null});} break;
    case 'qn-type':
      var qs=view.sheet; if(qs&&qs.type==='qnote'){var qt0=$('#qnText'),qp0=$('#qnPage');qs.draft=qt0?qt0.value:'';qs.pageDraft=qp0?qp0.value:'';
        var ex=qs.id?qnFind(qs.id):null; if(ex){ex.type=d.v;persist();}else qs.type0=d.v; renderSheet();} break;
    case 'qn-save':
      var qs2=view.sheet,qtx=$('#qnText'); if(!qs2||qs2.type!=='qnote'||!qtx)break;
      if(!qtx.value.trim()){toast(t('qnNeedText'));break;}
      var qpg=$('#qnPage'),qpv=qpg?parseInt(qpg.value,10):null,qex=qs2.id?qnFind(qs2.id):null;
      if(qex){qex.text=qtx.value.trim().slice(0,2000);qex.page=(qpv>0)?qpv:null;persist();}
      else qnAdd(qs2.bid,qs2.type0||'quote',qtx.value,qpv);
      toast(t('tpSaved')); if(qs2.back)openSheet(qs2.back);else closeSheet(); break;
    case 'qn-del':
      if(view.qnDel!==d.id){view.qnDel=d.id;renderSheet();break;}
      state.qnotes=qnAll().filter(function(x){return x.id!==d.id;});persist();view.qnDel=null;
      var qb2=view.sheet&&view.sheet.back; if(qb2)openSheet(qb2);else closeSheet(); break;
    case 'qn-share': if(qnFind(d.id))openSheet({type:'qshare',id:d.id,back:view.sheet&&view.sheet.type==='qnote'?view.sheet:null}); break;
    case 'qs-dl': qsBlob().then(function(bl){if(!bl){toast(t('wrapFail'));return;}var u=URL.createObjectURL(bl),a2=document.createElement('a');a2.href=u;a2.download='marginalia-note.png';document.body.appendChild(a2);a2.click();a2.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}); break;
    case 'qs-share': qsBlob().then(function(bl){if(!bl){toast(t('wrapFail'));return;}var f=new File([bl],'marginalia-note.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});}else toast(t('wrapFail'));}); break;
    case 'bn-menu': view.bmenu=!view.bmenu; renderMain(); break;
    case 'pick-banner': view.bmenu=false; renderMain(); $('#bannerFile').click(); break;
    case 'rm-avatar': profImg.avatar=''; try{localStorage.removeItem('marginalia.avatar');}catch(err){} renderMain(); break;
    case 'rm-banner': view.bmenu=false; profImg.banner=''; try{localStorage.removeItem('marginalia.banner');}catch(err){} renderMain(); break;
    case 'cover-pick': $('#coverFile').click(); break;
    case 'covers': if(b)openSheet({type:'covers',id:b.id,back:(view.sheet&&view.sheet.type==='book')?view.sheet:null}); break;
    case 'cover-lang': view.coverLang=d.v||''; renderSheet(); break;
    case 'cover-set':
      var cs=view.sheet,cb=cs&&find(cs.id),co=cs&&coverOpts[cs.id]&&coverOpts[cs.id].list[Number(d.i)];
      if(!cb||!co)break;
      if(covers[cb.id])dropCover(cb.id);
      cb.hasCover=false; cb.coverUrl=co.url; cb.coverSq=!!co.sq; persist(); renderMain();
      openSheet(cs.back||{type:'book',id:cb.id}); toast(t('toastCover'));
      break;
    case 'cover-auto':
      var cs2=view.sheet,cb2=cs2&&find(cs2.id); if(!cb2)break;
      if(covers[cb2.id])dropCover(cb2.id);
      cb2.hasCover=false; cb2.coverUrl=''; cb2.coverSq=false; cb2.coverTry=0; persist(); resolveMissingCovers(); renderMain();
      openSheet(cs2.back||{type:'book',id:cb2.id}); toast(t('toastCover'));
      break;
    case 'cover-remove':
      if(b===undefined||!view.sheet||view.sheet.type!=='book')break;
      var bb=find(view.sheet.id); if(bb){dropCover(bb.id);bb.hasCover=false;persist();refresh();} break;
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(view.fmtMenu&&!(e.target.closest&&e.target.closest('.fmtwrap'))){view.fmtMenu=false;if(view.sheet)renderSheet();}
  if(view.bmenu&&!(e.target.closest&&e.target.closest('.bnbtn'))){view.bmenu=false;if(!el||el.dataset.a!=='tab')renderMain();}
  if(el){
    var dd=el.dataset;
    if(dd.a==='rate'&&e.detail!==0&&el.getBoundingClientRect){var rc=el.getBoundingClientRect();if(e.clientX-rc.left<rc.width/2)dd=Object.assign({},dd,{v:String(Number(dd.v)-0.5)});}
    act(dd.a,dd);return;
  }
  if(e.target.id==='sheet')closeSheet();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(CASE.ph)caseClose();else if(TP.on&&!TP.comp)closeTimerPage();else if(TP.on)TP.comp=null,renderTimerPage();else if(SK.on)skClose();else if(view.sheet)closeSheet();}});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='nq'){view.nq=el.value;var nl=$('#qnList');if(nl)nl.innerHTML=qnListHTML();}
  else if(el.id==='q'){view.q=el.value;updateResults();onQueryChange(el.value);}
  else if(el.id==='sePages'||el.id==='sePage'){
    var sb=view.sheet&&find(view.sheet.bid); if(!sb)return;
    if(el.id==='sePages'){var np=Math.max(0,Math.min(sb.pages,sb.page+(parseInt(el.value,10)||0)));$('#sePage').value=np;}
    else{var dv=Math.max(0,(parseInt(el.value,10)||0)-sb.page);$('#sePages').value=dv;}
  }
  else if(el.id==='pgRange'){
    var b=view.sheet&&find(view.sheet.id); if(!b)return; var n=Number(el.value),au=fmtOf(b)==='audio',p=au?Math.round(n):Math.round(n/b.pages*100),pgN=au?Math.round(n/100*b.pages):n;
    $('#pgNum').value=n; $('#pgPct').textContent=p+'%'; var pm=$('#pgMini'); if(pm)pm.textContent=au?'':t('pageOf',{p:pgN,n:b.pages}); var bar=$('#pgBar'); if(bar)bar.style.width=p+'%';
  }
});
document.addEventListener('change',function(e){
  var el=e.target,b;
  if(el.id==='pgRange'||el.id==='pgNum'){
    b=view.sheet&&find(view.sheet.id); if(!b)return;
    var pv0=Number(el.value),fin=setPage(b,fmtOf(b)==='audio'?Math.round(Math.max(0,Math.min(100,pv0))/100*b.pages):el.value); refresh(); if(fin){toast(t('toastFinished',{t:titleOf(b)}));promptFinish(b);}
  }else if(el.id==='pgDate'){
    view.pgDay=el.value||null;
  }else if(el.id==='review'){
    b=find(el.dataset.id); if(b){b.review=el.value.slice(0,4000);persist();syncShared(b);}
  }else if(el.id==='startDate'||el.id==='endDate'){
    b=find(el.dataset.id); if(!b)return;
    var dv=el.value||null,isS=el.id==='startDate';
    if(!dv&&!isS){refresh();return;}
    var ds=isS?dv:b.startedAt,de=isS?b.finishedAt:dv;
    if(ds&&de&&de<ds){toast(t('dateErr'));refresh();return;}
    var oldD=isS?b.startedAt:b.finishedAt;
    if(oldD&&dv&&oldD!==dv){
      var mv=state.logs.filter(function(x){return x.bid===b.id&&x.d===oldD;}),tg=state.logs.filter(function(x){return x.bid===b.id&&x.d===dv;})[0];
      mv.forEach(function(x){if(tg){tg.p=(tg.p||0)+(x.p||0);tg.s=(tg.s||0)+(x.s||0);state.logs=state.logs.filter(function(y){return y!==x;});}else x.d=dv;});
    }
    if(isS)b.startedAt=dv;else b.finishedAt=dv;
    view.editBook=false;persist();refresh();
  }else if(el.id==='notes'){
    b=find(el.dataset.id); if(b){b.notes=el.value.slice(0,4000);persist();}
  }else if(el.id==='pgTotal'){
    b=find(el.dataset.id); var n=Math.round(Number(el.value));
    if(b&&n>0&&n<=10000){view.editBook=false;b.pages=n;if(b.page>n)b.page=n;if(b.status==='reading'&&b.page>=n){b.status='finished';b.finishedAt=dayOffset(0);logEvent('finished',b);}persist();refresh();}
  }else if(el.id==='goal'){
    var g=Math.round(Number(el.value)); if(g>0&&g<=500){state.goal=g;persist();renderMain();}
  }else if(el.id==='genreSel'){
    b=find(el.dataset.id); if(b){view.editBook=false;b.genre=el.value;persist();refresh();}
  }else if(el.id==='authFile'){
    var af=el.files&&el.files[0]; el.value=''; if(af&&view.sheet&&view.sheet.type==='author')startCrop(af,true,view.sheet.name);
  }else if(el.id==='avatarFile'||el.id==='bannerFile'){
    var pf=el.files&&el.files[0],isAv=el.id==='avatarFile'; el.value=''; if(!pf)return;
    startCrop(pf,isAv);
  }else if(el.id==='relDate'){
    b=find(el.dataset.id); if(!b)return;
    if(el.value)b.rel=el.value;else delete b.rel;
    persist(); refresh();
  }else if(el.id==='origTitle'){
    b=find(el.dataset.id); if(!b)return;
    var ov=el.value.trim();
    if(ov&&norm(ov)!==norm(b.title))b.orig=ov.slice(0,140);else delete b.orig;
    origMemo={};delete metaC[b.id];delete metaS[b.id];saveMeta();persist();view.editBook=false;refresh();ensureMeta(b);
  }else if(el.id==='ioFile'){
    var iof=el.files&&el.files[0]; el.value=''; if(iof&&view.sheet&&view.sheet.type==='io')ioRead(iof);
  }else if(el.id==='coverFile'){
    var f=el.files&&el.files[0]; el.value=''; if(!f||!view.sheet||(view.sheet.type!=='book'&&view.sheet.type!=='covers'))return;
    var id=view.sheet.id,vs0=view.sheet;
    startCoverCrop(f,id,vs0.type==='covers'?(vs0.back||{type:'book',id:id}):vs0);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='customForm')return; e.preventDefault();
  var f=e.target.elements,title=f.title.value.trim(); if(!title)return;
  var author=f.author.value.trim()||t('unknownAuthor'),pages=Math.max(1,Math.min(10000,Math.round(Number(f.pages.value))||300));
  if(inLib(null,title,author)){toast(t('toastDup'));return;}
  addBook({cid:null,title:title,author:author,pages:pages,genre:f.genre.value},f.status.value);
  e.target.reset(); updateResults(); toast(t('toastAdded',{t:title}));
});

/* ================= boot ================= */
renderAll(); initCloud(); loadGKey(); resolveMissingCovers(); loadHc(); notesMigrate(); setTimeout(upCheckReleased,900);
})();
