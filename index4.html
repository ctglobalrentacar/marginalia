<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark, single phone-width column. Home leads with a big "up next" card tinted by the book's colour, then poster rails. Floating pill nav, search circle and add button sit over the content. */
:root{
  color-scheme:dark;
  --bg:#0A0912; --surface:#15131F; --surface2:#1E1B2E; --line:#2B2740; --ink:#F3F1FA; --muted:#9C97B3;
  --violet:#A855F7; --indigo:#6366F1; --cyan:#38BDF8; --green:#34D399; --amber:#FACC15; --pink:#F472B6; --red:#F87171;
  --gh:268;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
body{
  background:radial-gradient(120% 460px at 50% -60px,hsl(var(--gh) 65% 21% / .9),transparent 72%) no-repeat,var(--bg);
  color:var(--ink);font:15px/1.4 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px 190px;min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.plain{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;color:inherit;width:100%}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:14px 6px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:19px;text-transform:uppercase}
.brand b{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot[data-s="cloud"]{background:var(--green)}.dot[data-s="err"]{background:var(--red)}
.pagetitle{font-size:26px;font-weight:700;margin:0}
.kind{display:flex;gap:2px;padding:4px;border-radius:999px;border:2px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,var(--violet),var(--cyan)) border-box}
.kind button{border:0;background:none;color:var(--muted);height:36px;min-width:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:0 10px;cursor:pointer;font-size:14px}
.kind button[aria-pressed="true"]{background:var(--violet);color:#fff}

/* section headings */
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.sh::before{content:"";width:4px;height:22px;border-radius:4px;background:var(--violet);flex:none}
.sh h2{margin:0;font-size:17px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.sh small{color:var(--muted);font-size:14px}
.sh .count{background:var(--indigo);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}
.note{color:var(--muted);font-size:13px;margin:-6px 0 12px}

/* covers */
.cover{aspect-ratio:2/3;width:100%;border-radius:4px 10px 10px 4px;color:hsl(var(--h) 70% 95%);padding:11% 9% 9% 17%;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;
  background:linear-gradient(90deg,rgba(0,0,0,.32) 0 6%,rgba(255,255,255,.14) 6% 8%,transparent 8%),hsl(var(--h) 42% 30%);
  box-shadow:0 2px 4px rgba(0,0,0,.4),0 10px 20px -10px rgba(0,0,0,.7)}
.cover.v1{background:linear-gradient(90deg,rgba(0,0,0,.32) 0 6%,rgba(255,255,255,.14) 6% 8%,transparent 8%),linear-gradient(transparent 72%,hsla(var(--h),70%,72%,.28) 72%),hsl(var(--h) 42% 30%)}
.cover.v2{background:linear-gradient(90deg,rgba(0,0,0,.32) 0 6%,rgba(255,255,255,.14) 6% 8%,transparent 8%),radial-gradient(circle at 82% 88%,hsla(var(--h),80%,76%,.32) 0 24%,transparent 25%),hsl(var(--h) 42% 30%)}
.cover.img{padding:0;background:#000}
.cover.img img{width:100%;height:100%;object-fit:cover;display:block}
.ct{font-family:var(--serif);font-weight:600;line-height:1.08;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow-wrap:anywhere}
.ca{font-size:.62em;opacity:.8;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cover.xs{font-size:7px}.cover.xs .ct{font-size:9px;-webkit-line-clamp:4}.cover.xs .ca{display:none}
.cover.sm{font-size:11px}.cover.sm .ct{font-size:13px}
.cover.md{font-size:13px}.cover.md .ct{font-size:15px}
.cover.lg{font-size:16px}.cover.lg .ct{font-size:21px}

.ri,.dc,.gitem,.pk{min-width:0}
.ri,.dc,.gitem{grid-template-columns:minmax(0,1fr)}
.ri>*,.dc>*,.gitem>*{min-width:0;max-width:100%}
.cover{min-width:0;max-width:100%}
.ct{max-width:100%}
.btn .ic{vertical-align:-3px}
.timerbar{position:absolute;left:0;right:76px;bottom:76px;display:flex;align-items:center;gap:8px;background:rgba(21,19,31,.96);border:1px solid var(--cyan);border-radius:20px;padding:8px 8px 8px 14px;backdrop-filter:blur(14px);pointer-events:auto;min-width:0}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.tdot.on{background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tdot.on{animation:none}}
.tmain{display:grid;min-width:0;flex:1}
.tmain b{font-size:20px;line-height:1.1}
.ttl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h3{margin:0;font-size:20px}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;padding:0}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd span{text-align:center;color:var(--muted);font-size:13px;padding:4px 0}
.cal-cell{position:relative;display:block;aspect-ratio:2/3;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);padding:0;overflow:hidden;color:var(--muted);text-align:left;min-width:0}
.cal-cell.blank{border:0;background:none}
.cal-cell .dn{position:absolute;top:4px;left:6px;z-index:3;font-weight:600;font-size:12px;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.9)}
button.cal-cell{cursor:pointer;border-color:transparent}
.cal-cell.today{box-shadow:0 0 0 2px var(--cyan)}
.cal-cell .cover{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none;padding:18% 8% 8% 14%}
.cal-cell .cover .ct{font-size:6px;-webkit-line-clamp:6}
.cal-cell .cover .ca{display:none}
.cal-more{position:absolute;right:3px;bottom:3px;z-index:3;background:rgba(0,0,0,.72);color:#fff;border-radius:8px;font-size:11px;font-weight:700;padding:1px 6px}
.rc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;background:#000}
.avwrap{position:relative;flex:none}
.avedit{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);background:var(--cyan);color:#06222F;display:grid;place-items:center;cursor:pointer;padding:0}
.avedit .ic{font-size:15px}
.bnbtn{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.online-note{color:var(--muted);font-size:12px;margin:10px 0 0}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px;padding-top:calc(min(63%,285px) + 44px);border:1px solid hsl(var(--h) 70% 42% / .7);
  background:radial-gradient(110% 80% at 85% 5%,hsl(var(--h) 72% 36%),hsl(var(--h) 62% 13%) 68%),#000}
.hero-open{position:absolute;inset:0;z-index:1;background:none;border:0;cursor:pointer;border-radius:26px}
.hero-art{position:absolute;top:22px;right:22px;width:42%;max-width:190px;transform:rotate(3deg)}
.tag{position:absolute;top:0;right:0;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:0 26px 0 22px;font-weight:800;letter-spacing:.06em;font-size:16px;color:#06251A;background:var(--green)}
.tag.want{background:var(--violet);color:#fff}
.hero-body{position:relative;z-index:2;display:grid;gap:8px;pointer-events:none}
.hero-body button{pointer-events:auto}
.hero h3{font-family:var(--serif);font-size:30px;line-height:1.05;margin:0;font-weight:600;letter-spacing:-.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hero .meta{margin:0;color:rgba(255,255,255,.82);font-size:15px}
.segwrap{position:relative;padding-top:34px;margin-top:4px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.segs span{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.segs span i{display:block;height:100%;background:var(--green)}
.segs span.cur i{background:var(--violet)}
.segbadge{position:absolute;top:0;transform:translateX(-50%);background:linear-gradient(90deg,var(--violet),var(--indigo));color:#fff;border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.segbadge::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--indigo);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.hero-foot{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.85);font-size:15px}
.hero-foot b{font-size:15px}
.hq{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;min-height:40px}
.btn.sm{padding:4px 14px;min-height:36px;font-size:14px}
.btn.glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--indigo));border-color:transparent;color:#fff}
.btn.danger{color:var(--red)}

/* rails */
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;margin-inline:-2px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.ri{flex:none;width:116px;scroll-snap-align:start;display:grid;gap:8px;align-content:start}
.ri .pw{position:relative;border-radius:12px;padding:3px;border:2px solid transparent}
.ri.sel .pw{border-color:var(--red)}
.rl{font-size:14px;color:var(--muted);line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.ri.sel .rl{color:var(--ink)}
.rbadge{position:absolute;top:3px;left:3px;border-radius:10px 0 10px 0;padding:3px 9px;font-weight:800;font-size:13px;color:#0A0912;z-index:2}
.sico{position:absolute;left:3px;bottom:3px;width:26px;height:26px;border-radius:8px 0 8px 0;background:var(--indigo);color:#fff;display:grid;place-items:center;z-index:2;font-size:13px}
.sico.fin{background:var(--green);color:#06251A}
.newtag{position:absolute;top:3px;right:3px;background:var(--green);color:#06251A;border-radius:0 10px 0 10px;padding:3px 9px;font-weight:800;font-size:13px;z-index:2}
.pk{position:relative;flex:none;width:176px;padding-left:34px;scroll-snap-align:start}
.bignum{position:absolute;left:-2px;bottom:34px;font-size:150px;font-weight:800;line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.14);pointer-events:none;letter-spacing:-.06em}
.pk .pw{position:relative}
.pk .rl{margin-top:8px}
.dc{flex:none;width:156px;scroll-snap-align:start;display:grid;gap:8px;align-content:start}
.dbox{border:1.5px solid var(--violet);background:var(--surface);border-radius:14px;padding:8px 10px;text-align:center;color:var(--cyan);font-size:14px;line-height:1.15}
.dbox b{display:block;color:var(--ink);font-size:24px;font-weight:600}
.dc .pw{position:relative}
.dtag{position:absolute;top:0;right:0;background:var(--indigo);color:#fff;font-weight:700;font-size:12px;letter-spacing:.05em;padding:4px 10px;border-radius:0 10px 0 10px;text-transform:uppercase;z-index:2}
.dpg{position:absolute;right:0;bottom:0;background:var(--indigo);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:10px 0 10px 0;z-index:2}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);text-align:center}
.empty .btn{margin-top:12px}
.banner{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;margin:8px 0}
.banner p{margin:0;min-width:0}

/* track */
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 6px}
.subtabs button{background:none;border:0;display:grid;justify-items:center;gap:6px;padding:8px 2px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;position:relative}
.subtabs button .ic{font-size:20px}
.subtabs button[aria-selected="true"]{color:var(--ink)}
.subtabs button[aria-selected="true"]::after{content:"";position:absolute;bottom:0;left:50%;width:34px;height:3px;border-radius:3px;transform:translateX(-50%);background:linear-gradient(90deg,var(--violet),var(--indigo))}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.row .t{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.row .by{color:var(--muted);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:99px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 12px;margin-top:10px}
.gitem{display:grid;gap:6px;min-width:0;align-content:start}
.gitem .pw{position:relative}

/* journal */
.grp{display:flex;align-items:center;gap:12px;margin:26px 0 10px}
.grp::before,.grp::after{content:"";height:1px;flex:1;background:var(--gc,var(--violet));opacity:.55}
.grp span{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:7px 16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:15px;background:var(--gc,var(--violet));color:#0A0912}
.grp span em{font-style:normal;background:rgba(0,0,0,.25);border-radius:999px;padding:0 9px;color:inherit}
.dayline{color:var(--muted);font-size:14px;margin:12px 0 8px 58px}
.ev{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;margin-bottom:12px;position:relative}
.ev::before{content:"";position:absolute;left:15px;top:34px;bottom:-14px;width:2px;background:var(--line)}
.ev:last-child::before{display:none}
.ev-time{display:grid;justify-items:center;align-content:start;gap:4px;font-size:11px;color:var(--muted);position:relative;z-index:1}
.ev-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#0A0912}
.ev-dot .ic{font-size:16px;fill:currentColor;stroke:none}
.ev-dot .ic.s{fill:none;stroke:currentColor;stroke-width:2.2}
.ev-card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;
  background:linear-gradient(90deg,hsl(var(--h) 55% 17%),hsl(var(--h) 40% 10%));border:1px solid hsl(var(--h) 40% 24%)}
.ev-card small{color:var(--muted);letter-spacing:.12em;font-weight:600;font-size:11px;text-transform:uppercase}
.ev-card b{display:block;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.ev-card span.m{color:var(--muted);font-size:14px}
.ev-card .rt{color:var(--amber);font-weight:700;display:flex;gap:4px;align-items:center}
.ev-card .rt .ic{fill:currentColor;stroke:none;font-size:15px}

/* profile */
.banner-art{height:190px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.pf-head{display:flex;gap:16px;align-items:flex-end;margin-top:-52px;position:relative}
.avatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--violet);background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:700;box-shadow:0 0 0 4px var(--bg)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pf-name{margin:0;font-size:26px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.chips4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.chip4{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.chip4 b{display:block;font-size:22px;font-weight:700}
.chip4 span{font-size:12px;color:var(--muted)}
.lvl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;border:1.5px solid var(--cyan);border-radius:var(--r);padding:14px;background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(168,85,247,.1))}
.lvl h3{margin:0;font-size:20px;font-weight:700}
.lvl .rk{color:var(--cyan);font-size:16px}
.lvl .xp{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lvl .xp small{color:var(--cyan)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hist{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:130px}
.hist div{display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.hist i{display:block;width:100%;border-radius:8px 8px 3px 3px;min-height:5px}
.hist small{color:var(--muted);font-size:12px}
.hist em{font-style:normal;font-size:12px;color:var(--muted)}
.avg{color:var(--green);font-weight:800;font-size:20px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,textarea,.field{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:42px;width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 18px;min-height:48px}
details.custom{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
details.custom summary{cursor:pointer;font-weight:700;padding:12px 0}
details.custom .form{padding-bottom:16px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}

    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      var c=db.collection('data/users/'+id),d=c.doc('library');
      var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},10000);});
      return Promise.race([d.get(),timeout]).then(function(snap){
        ref=d;col=c;syncMode='cloud';
        if(snap.exists&&!userEdited){
          var data=snap.data();
          if(data&&Array.isArray(data.books)){
            state=normalize(clone(data));

            var jobs=state.books.filter(function(b){return b.hasCover&&!covers[b.id];}).map(function(b){

function logEvent(type,b,v){
  var now=Date.now(),L=state.events;

    var last=L[0];
    if(last&&last.type==='pages'&&last.bid===b.id&&now-last.t<3600000&&new Date(last.t).toDateString()===new Date(now).toDateString()){last.v+=v;last.t=now;return;}
  }

}

  if(delta>0){if(!s){s={d:d,p:0};state.sessions.push(s);}s.p+=delta;}

  if(n>=b.pages){if(b.status!=='finished'){finishedNow=true;logEvent('finished',b);}b.status='finished';b.finishedAt=d;}

  else if(prev==='finished'){b.finishedAt=null;b.page=0;}
  if(s==='reading'&&(prev==='want'||prev==='finished')){b.startedAt=d;logEvent('started',b);}

}

function pickMatch(items,title,get){
  var n=norm(title),ex=[],pre=[];
  items.forEach(function(x){var s=norm(get(x));if(!s)return;if(s===n)ex.push(x);else if(s.indexOf(n+' ')===0||n.indexOf(s+' ')===0)pre.push(x);});

function ensureMeta(b){
  if(!b||metaFresh(b.id)||metaS[b.id]==='loading')return;
  metaS[b.id]='loading';
  var ti=metaTitle(b),au=authorOf(b)||'',first=au.split(',')[0].trim(),fails=0;
  var enc=encodeURIComponent;
  var g='https://www.googleapis.com/books/v1/volumes?q='+enc('intitle:'+ti+(first?' inauthor:'+first:''))+'&maxResults=10&printType=books';
  var o='https://openlibrary.org/search.json?title='+enc(ti)+(first?'&author='+enc(first):'')+'&limit=10&fields=key,title,ratings_average,ratings_count,already_read_count,want_to_read_count,first_publish_year,number_of_pages_median,publisher,language';
  var mo=first?'https://www.googleapis.com/books/v1/volumes?q='+enc('inauthor:"'+first+'"')+'&maxResults=20&printType=books':'';
  function safe(u){if(!u)return Promise.resolve(null);return fetchJSON(u).then(function(d){return d;},function(){fails++;return null;});}
  Promise.all([safe(g),safe(o),safe(mo)]).then(function(r){
    var tries=mo?3:2;
    if(fails>=tries){metaS[b.id]='err';softSheet(b.id);return;}
    var m={t:Date.now(),info:{}};
    var gi=((r[0]&&r[0].items)||[]).map(function(x){return x.volumeInfo||{};});
    var gm=pickMatch(gi,ti,function(v){return v.title;});
    var rated=gm.filter(function(v){return v.averageRating>0&&v.ratingsCount>0;}).sort(function(a,c){return c.ratingsCount-a.ratingsCount;})[0];
    if(rated)m.g={avg:rated.averageRating,count:rated.ratingsCount};
    var best=gm.filter(function(v){return v.description;})[0]||gm[0];
    if(best){
      m.desc=cleanHtml(best.description);
      var ids=best.industryIdentifiers||[],i13=ids.filter(function(x){return x.type==='ISBN_13';})[0]||ids[0];
      m.info={publisher:best.publisher||'',published:best.publishedDate||'',pages:best.pageCount||0,lang:best.language||'',cats:(best.categories||[]).slice(0,2).join(', '),isbn:i13?i13.identifier:''};
    }
    var od=(r[1]&&r[1].docs)||[],om=pickMatch(od,ti,function(x){return x.title;});
    var orated=om.filter(function(x){return x.ratings_count>0&&x.ratings_average>0;}).sort(function(a,c){return c.ratings_count-a.ratings_count;})[0];
    if(orated)m.o={avg:orated.ratings_average,count:orated.ratings_count,read:orated.already_read_count||0};
    var o0=om[0];
    if(o0){
      if(!m.info.publisher&&o0.publisher)m.info.publisher=o0.publisher[0]||'';
      if(!m.info.pages&&o0.number_of_pages_median)m.info.pages=o0.number_of_pages_median;
      if(!m.info.lang&&o0.language)m.info.lang=o0.language[0]||'';
      if(!m.info.published&&o0.first_publish_year)m.info.published=String(o0.first_publish_year);
    }
    var seen={},nt=norm(ti),fa=norm(first);
    m.more=mapG(r[2]||{}).filter(function(it){
      var k=norm(it.title);
      if(!k||seen[k]||k===nt||k.indexOf(nt+' ')===0||nt.indexOf(k+' ')===0)return false;
      if(fa&&norm(it.author).indexOf(fa)<0)return false;
      if(!it.cover)return false;
      seen[k]=1;return true;
    }).slice(0,12);
    metaC[b.id]=m;saveMeta();metaS[b.id]='done';softSheet(b.id);
  });
}

  if(val&&val.avg){sd=roStars(val.avg)+'<span>'+esc(val.count===1?t('ratingOne'):t('ratingsN',{n:fmtNum(val.count)}))+'</span>';sc='<div class="sc tnum">'+esc(fmtNum(val.avg,2))+'</div>';}
  else{sd='<span>'+esc(state==='loading'?t('ratingsLoading'):(state==='err'?t('ratingsUnavail'):t('noRatings')))+'</span>';sc='<div class="sc none">–</div>';}
  return '<div class="src'+(first?' first':'')+'"><div style="min-width:0"><div class="nm">'+esc(name)+'</div><div class="sd">'+sd+'</div></div>'+sc+'</div>';
}

function heroHTML(b,idx,total){
  var h=hue(b.cid||b.title),p=pct(b),reading=b.status==='reading';
  var cur=Math.min(9,Math.floor(p/10)),segs='';
  for(var i=0;i<10;i++){var f=Math.max(0,Math.min(1,(p-i*10)/10));segs+='<span'+(i===cur&&p<100&&p>0?' class="cur"':'')+'><i style="width:'+Math.round(f*100)+'%"></i></span>';}
  var d=etaDays(b),badge;
  if(reading&&d!=null){var dt=new Date();dt.setDate(dt.getDate()+d);badge=t('doneBy',{d:dt.toLocaleDateString(lang(),{weekday:'short',month:'short',day:'numeric'})});}
  else badge=reading?t('pageOf',{p:b.page,n:b.pages}):pg(b.pages);
  var left=reading?(cur*10+5):5;
  var meta=reading?t('pageOf',{p:b.page,n:b.pages}):pg(b.pages);
  var g=b.genre?' · '+genreLabel(b.genre):'';
  var quick=reading
    ?['10','25','50'].map(function(n){return '<button class="btn sm glass" data-a="quick" data-id="'+b.id+'" data-v="'+n+'">+'+n+'</button>';}).join('')+timerBtn(b,true)
    :'<button class="btn sm primary" data-a="status" data-id="'+b.id+'" data-v="reading">'+esc(t('startBtn'))+'</button>';
  return '<section class="hero" style="--h:'+h+'">'
   +'<button class="hero-open" data-a="open" data-id="'+b.id+'" aria-label="'+esc(titleOf(b))+'"></button>'
   +'<span class="tag'+(reading?'':' want')+'">'+svg('play')+esc(reading?t('resume'):t('startBtn')).toUpperCase()+'</span>'
   +'<div class="hero-art">'+cover(b,'lg')+'</div>'
   +'<div class="hero-body"><h3>'+esc(titleOf(b))+'</h3><p class="meta tnum">'+esc(meta+g)+'</p>'
   +'<div class="segwrap"><span class="segbadge tnum" style="left:clamp(64px,'+left+'%,calc(100% - 64px))">'+esc(badge)+'</span><div class="segs">'+segs+'</div></div>'
   +'<div class="hero-foot"><span>'+esc(reading?t('continueReading'):t('readyToStart'))+'</span><b class="tnum">'+p+'%</b></div>'
   +'<div class="hq">'+quick+'</div></div></section>';
}

function renderHome(){
  var q=queue(),h=sampleBanner();
  if(q.length&&(!view.hero||!q.some(function(b){return b.id===view.hero;})))view.hero=q[0].id;
  var idx=q.map(function(b){return b.id;}).indexOf(view.hero);
  h+=secHead(t('upNext'),q.length?'<small class="tnum">'+(idx+1)+'/'+q.length+'</small>':'');
  if(!q.length){
    h+='<div class="empty">'+esc(t('emptyQueue'))+'<br><button class="btn primary" data-a="goto-search">'+esc(t('search'))+'</button></div>';
  }else{
    h+=heroHTML(q[idx],idx,q.length)+'<div class="rail" style="margin-top:16px">'+q.map(function(b){return railItem(b,b.id===view.hero);}).join('')+'</div>';
  }
  // top 10
  h+=secHead(t('top10'))+'<p class="note">'+esc(t('top10sub'))+'</p><div class="rail">'+TOP.map(function(id,i){
    var c=CATBY[id],have=inLib(id);
    if(view.kind!=='all'&&(NONFIC[c.genre]?'nonfiction':'fiction')!==view.kind)return '';
    return '<div class="pk"><span class="bignum">'+(i+1)+'</span><button class="plain pw" data-a="'+(have?'open':'cat')+'" data-id="'+(have?have.id:c.id)+'" aria-label="'+esc(lang()==='es'?c.es:c.en)+'">'+catCover(c,'md')+(have?statusIcon(have):'')+'</button><span class="rl">'+esc(lang()==='es'?c.es:c.en)+'</span></div>';
  }).join('')+'</div>';
  // finish line
  var fl=visible(by('reading')).map(function(b){return {b:b,d:etaDays(b)};}).filter(function(x){return x.d!=null&&x.d<=60;}).sort(function(a,b){return a.d-b.d;}).slice(0,8);
  h+=secHead(t('finishLine'),fl.length?'<span class="count">'+fl.length+'</span>':'')+'<p class="note">'+esc(t('finishLineSub'))+'</p>';
  if(!fl.length)h+='<div class="empty">'+esc(t('finishLineEmpty'))+'</div>';
  else h+='<div class="rail">'+fl.map(function(x){
    var dt=new Date();dt.setDate(dt.getDate()+x.d);
    var tag=x.d===1?t('tomorrow'):t('inDays',{n:x.d});
    return '<div class="dc"><div class="dbox">'+esc(dt.toLocaleDateString(lang(),{month:'short'}))+'<b class="tnum">'+pad(dt.getDate())+'</b></div><button class="plain pw" data-a="open" data-id="'+x.b.id+'" aria-label="'+esc(titleOf(x.b))+'">'+cover(x.b,'md')+'<span class="dtag">'+esc(tag)+'</span><span class="dpg tnum">'+x.b.page+'/'+x.b.pages+'</span></button><span class="rl">'+esc(titleOf(x.b))+'</span></div>';
  }).join('')+'</div>';
  // recently added
  var rec=visible(state.books).slice(0,10);
  if(rec.length){
    h+=secHead(t('recent'),'<span class="count">'+rec.length+'</span>')+'<div class="rail">'+rec.map(function(b){
      var nw=b.addedAt&&Date.now()-b.addedAt<7*864e5;
      return '<div class="ri"><button class="plain pw" data-a="open" data-id="'+b.id+'" aria-label="'+esc(titleOf(b))+'" style="position:relative;display:block">'+cover(b,'md')+ratingBadge(b)+(nw?'<span class="newtag">'+esc(t('newTag'))+'</span>':'')+statusIcon(b)+'</button><span class="rl">'+esc(titleOf(b))+'</span></div>';
    }).join('')+'</div>';
  }
  return h;
}

function resultsHTML(){
  var q=norm(view.q),L=lang();
  var items=CAT.filter(function(c){
    if(view.genre&&c.genre!==view.genre)return false;
    return !q||norm(c.en).indexOf(q)>-1||norm(c.es).indexOf(q)>-1||norm(c.author).indexOf(q)>-1;
  });
  if(!items.length)return '<p class="empty" style="margin-top:12px">'+esc(t('noMatch'))+'</p>';
  var head=(q||view.genre)?(items.length===1?t('matchOne'):t('matchN',{n:items.length})):t('browse');
  return secHead(head)+items.map(function(c){
    var have=inLib(c.id),ttl=L==='es'?c.es:c.en,acts;
    if(have)acts='<button class="btn sm" data-a="open" data-id="'+have.id+'">'+esc(t('st_'+have.status))+'</button>';

    return '<div class="row"><button class="plain" data-a="'+(have?'open':'cat')+'" data-id="'+(have?have.id:c.id)+'" aria-label="'+esc(ttl)+'">'+catCover(c,'xs')+'</button><div style="min-width:0"><div class="t">'+esc(ttl)+'</div><div class="by">'+esc(c.author)+'</div><div class="by tnum">'+esc(genreLabel(c.genre)+' · '+c.year+' · '+pg(c.pages))+'</div></div><div class="acts">'+acts+'</div></div>';

var EVSTYLE={rated:['var(--amber)','star','evRated',false],finished:['var(--green)','check','evFinished',true],started:['var(--violet)','play','evStarted',false],pages:['var(--cyan)','pages','evLogged',false],added:['var(--pink)','plus','evAdded',true],session:['var(--cyan)','timer','evSession',true]};
function renderJournal(){
  var now=new Date(),todayKey=iso(now),yKey=dayOffset(1);
  var ev=state.events.filter(function(e){var b=find(e.bid);return b&&(view.kind==='all'||kindOf(b)===view.kind);});
  if(!ev.length)return '<div class="empty">'+esc(t('journalEmpty'))+'</div>';
  var groups=[['today','gToday','var(--violet)'],['yesterday','gYesterday','var(--green)'],['week','gWeek','var(--amber)'],['earlier','gEarlier','#8B87A3']],map={today:[],yesterday:[],week:[],earlier:[]};
  ev.forEach(function(e){
    var k=iso(new Date(e.t)),age=(now-new Date(e.t))/864e5;
    (k===todayKey?map.today:k===yKey?map.yesterday:age<=7?map.week:map.earlier).push(e);
  });
  var h='';
  groups.forEach(function(g){
    var list=map[g[0]]; if(!list.length)return;
    h+='<div class="grp" style="--gc:'+g[2]+'"><span>'+esc(t(g[1]))+' <em class="tnum">'+list.length+'</em></span></div>';
    var lastDay='';
    list.forEach(function(e){
      var b=find(e.bid),k=iso(new Date(e.t)),st=EVSTYLE[e.type]||EVSTYLE.pages;
      if(k!==lastDay){lastDay=k;h+='<div class="dayline">'+esc(fmtDay(k,{weekday:'short',month:'short',day:'numeric'}))+'</div>';}
      var m=e.type==='pages'?'+'+pg(e.v)+' · '+t('pageOf',{p:b.page,n:b.pages}):(e.type==='session'?durText(e.v):(e.type==='finished'?pg(b.pages):authorOf(b)));
      var rt=e.type==='rated'?'<span class="rt">'+svg('star')+'<span class="tnum">'+e.v+'.0</span></span>':'<span></span>';
      h+='<div class="ev"><div class="ev-time"><span class="ev-dot" style="background:'+st[0]+'">'+svg(st[1],st[3]?'s':'')+'</span><span class="tnum">'+esc(fmtTime(e.t))+'</span></div>'
       +'<button class="plain ev-card" style="--h:'+hue(b.cid||b.title)+'" data-a="open" data-id="'+b.id+'">'+cover(b,'xs')+'<span><small>'+esc(t(st[2]))+'</small><b>'+esc(titleOf(b))+'</b><span class="m">'+esc(m)+'</span></span>'+rt+'</button></div>';
    });
  });
  return h;
}

function ringSVG(done,goal){
  var C=2*Math.PI*52,p=Math.min(1,goal?done/goal:0);
  return '<svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="'+esc(done+' / '+goal)+'"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#38BDF8"/></linearGradient></defs>'
   +'<circle cx="65" cy="65" r="52" fill="none" stroke="#1E1B2E" stroke-width="12"/>'
   +'<circle cx="65" cy="65" r="52" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 65 65)"/>'
   +'<text x="65" y="70" text-anchor="middle" font-family="Outfit,system-ui,sans-serif" font-size="34" font-weight="700" fill="#F3F1FA">'+done+'</text>'
   +'<text x="65" y="90" text-anchor="middle" font-size="12" fill="#9C97B3" font-family="Outfit,system-ui,sans-serif">'+esc(t('ofBooks',{n:goal}))+'</text></svg>';
}
function weekSVG(){
  var m=pagesByDay(),days=[],max=0,i;
  for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var v=m[iso(d)]||0;days.push({d:d,v:v,today:i===0});if(v>max)max=v;}
  var base=118,mh=82,step=320/7,bw=28,out='<svg class="chart" viewBox="0 0 320 146" width="100%" role="img" aria-label="'+esc(t('last7'))+'">';
  days.forEach(function(x,k){
    var h=max?Math.max(x.v?4:0,Math.round(x.v/max*mh)):0,bx=k*step+(step-bw)/2;
    if(x.v)out+='<rect class="bx'+(x.today?' today':'')+'" x="'+bx.toFixed(1)+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="6"/><text class="v" x="'+(bx+bw/2).toFixed(1)+'" y="'+(base-h-6)+'" text-anchor="middle">'+x.v+'</text>';
    else out+='<rect x="'+bx.toFixed(1)+'" y="'+(base-2)+'" width="'+bw+'" height="2" rx="1" fill="#2B2740"/>';
    out+='<text x="'+(bx+bw/2).toFixed(1)+'" y="136" text-anchor="middle">'+esc(x.d.toLocaleDateString(lang(),{weekday:'narrow'}))+'</text>';
  });
  return out+'<line class="base" x1="0" x2="320" y1="'+base+'" y2="'+base+'"/></svg>';
}
function renderGoals(){
  var yr=new Date().getFullYear(),fin=by('finished');
  var done=fin.filter(function(b){return b.finishedAt&&String(b.finishedAt).slice(0,4)===String(yr);}).length;
  var left=Math.max(0,state.goal-done),m=pagesByDay(),week=0;for(var i=0;i<7;i++)week+=m[dayOffset(i)]||0;
  var gc={};fin.forEach(function(b){var g=b.genre||'other';gc[g]=(gc[g]||0)+1;});
  var gl=Object.keys(gc).sort(function(a,b){return gc[b]-gc[a];}).slice(0,6),gmax=gl.length?gc[gl[0]]:1;
  var h='<div class="card goal" style="margin-top:12px">'+ringSVG(done,state.goal)+'<div style="min-width:0;flex:1 1 160px"><h3>'+esc(t('goalTitle',{y:yr}))+'</h3><p class="by">'+esc(left?t('toGo',{n:left}):t('goalDone'))+'</p><label class="by" for="goal">'+esc(t('booksThisYear'))+'</label><br><input id="goal" type="number" min="1" max="500" inputmode="numeric" value="'+state.goal+'"></div></div>';
  h+=secHead(t('last7'),'<small class="tnum">'+esc(pg(week))+'</small>')+'<div class="card">'+weekSVG()+'</div>';
  h+=secHead(t('byGenre'));

/* ================= actions ================= */
function act(a,d){
  var b=d.id?find(d.id):null,c;
  switch(a){
    case 'tab': view.tab=d.v; renderMain(); window.scrollTo(0,0); break;
    case 'kind': view.kind=d.v; renderMain(); break;
    case 'sub': view.sub=d.v; renderMain(); break;
    case 'lib-filter': view.lib=d.v; renderMain(); break;
    case 'genre': view.genre=d.v; renderMain(); break;
    case 'hero': if(view.hero===d.id)openSheet({type:'book',id:d.id}); else{view.hero=d.id;renderMain();} break;
    case 'open': if(b)openSheet({type:'book',id:b.id}); break;
    case 'cat': if(CATBY[d.id])openSheet({type:'cat',id:d.id}); break;
    case 'close': closeSheet(); break;
    case 'fab': openSheet({type:'fab'}); break;
    case 'goto-search':
      if(view.sheet)closeSheet(); view.tab='explore'; renderMain(); window.scrollTo(0,0); if($('#q'))$('#q').focus(); break;
    case 'goto-add':
      closeSheet(); view.tab='explore'; renderMain(); window.scrollTo(0,0);
      if($('#custom')){$('#custom').open=true;if($('#customForm'))$('#customForm').elements.title.focus();} break;
    case 'quick':
      if(!b)break;
      var fin=setPage(b,b.page+Number(d.v));
      refresh();
      if(fin){toast(t('toastFinished',{t:titleOf(b)}));if(!view.sheet||view.sheet.type!=='book')openSheet({type:'book',id:b.id});}
      break;
    case 'status':
      if(!b)break; setStatus(b,d.v); refresh();
      if(d.v==='finished')toast(t('toastFinished',{t:titleOf(b)}));
      break;
    case 'rate':
      if(b){b.rating=b.rating===Number(d.v)?0:Number(d.v);if(b.rating)logEvent('rated',b,b.rating);persist();refresh();} break;
    case 'add':
    case 'add-cat':
      c=CATBY[d.cid]; if(!c||inLib(c.id))break;
      addBook({cid:c.id,title:c.en,author:c.author,pages:c.pages,genre:c.genre,year:c.year},d.s);
      if(a==='add-cat'){closeSheet();}else{updateResults();renderDock();}
      toast(d.s==='reading'?t('toastStarted'):t('toastWant')); break;
    case 'add-online':
      var it=online.items.filter(function(x){return x.key===d.k;})[0]; if(!it)break;
      if(inLib(null,it.title,it.author)){toast(t('toastDup'));break;}
      addBook({cid:null,title:it.title,author:it.author||t('unknownAuthor'),pages:it.pages>0?it.pages:300,genre:it.genre,year:it.year,coverUrl:it.cover},d.s);
      updateOnline(); toast(d.s==='reading'?t('toastStarted'):t('toastWant')); break;
    case 'levels': openSheet({type:'levels'}); break;
    case 'desc-toggle': view.descOpen=!view.descOpen; renderSheet(); break;
    case 'add-more':
      var mm=metaC[d.id],mi=mm&&mm.more&&mm.more[Number(d.i)]; if(!mi)break;
      if(inLib(null,mi.title,mi.author)){toast(t('toastDup'));renderSheet();break;}
      addBook({cid:null,title:mi.title,author:mi.author||t('unknownAuthor'),pages:mi.pages>0?mi.pages:300,genre:mi.genre,year:mi.year,coverUrl:mi.cover},'want');
      toast(t('toastWant')); renderSheet(); break;
    case 'remove-ask': view.confirmRemove=d.id; renderSheet(); break;
    case 'remove-cancel': view.confirmRemove=null; renderSheet(); break;
    case 'remove-yes':
      state.books=state.books.filter(function(x){return x.id!==d.id;});
      state.events=state.events.filter(function(x){return x.bid!==d.id;});
      state.logs=state.logs.filter(function(x){return x.bid!==d.id;});
      var tm0=getTimer(); if(tm0&&tm0.bid===d.id)clearTimer();
      if(covers[d.id])dropCover(d.id);
      persist(); closeSheet(); toast(t('toastRemoved')); break;
    case 'clear-sample':
      state.books=state.books.filter(function(x){return !x.sample;});
      state.sessions=state.sessions.filter(function(x){return !x.sample;});
      state.logs=state.logs.filter(function(l){return find(l.bid);});
      state.events=state.events.filter(function(e){return find(e.bid);});
      state.hasSample=false; persist(); renderMain(); toast(t('toastCleared')); break;
    case 'lang': state.lang=d.v; persist(); renderAll(); break;
    case 'edit-profile':
      if(view.editProfile){
        var n=$('#pName'),bi=$('#pBio');
        if(n)state.profile.name=n.value.trim().slice(0,40);
        if(bi)state.profile.bio=bi.value.trim().slice(0,200);
        persist();
      }
      view.editProfile=!view.editProfile; renderMain(); break;
    case 'timer-start':
      if(!b)break; var tcur=getTimer();
      if(tcur&&tcur.bid!==b.id){toast(t('timerBusy'));break;}
      if(!tcur)setTimer({bid:b.id,acc:0,since:Date.now()});
      renderTimerBar(); refresh(); break;
    case 'timer-toggle':
      var tt=getTimer(); if(!tt)break;
      if(tt.since){tt.acc+=Date.now()-tt.since;tt.since=0;}else tt.since=Date.now();
      setTimer(tt); renderTimerBar(); break;
    case 'timer-stop':
      var ts=getTimer(); if(!ts)break;
      if(ts.since){ts.acc+=Date.now()-ts.since;ts.since=0;} setTimer(ts);
      var secs=timerSecs(ts);
      if(secs<10){clearTimer();toast(t('toastShort'));refresh();break;}
      renderTimerBar(); openSheet({type:'session',bid:ts.bid,secs:secs}); break;
    case 'session-save':
      var sb2=view.sheet&&find(view.sheet.bid),ssecs=view.sheet?view.sheet.secs:0; if(!sb2)break;
      var pv=Math.round(Number($('#sePage').value)),sfin=false;
      if(isFinite(pv)&&pv!==sb2.page)sfin=setPage(sb2,pv);
      logDay(sb2,0,ssecs); logEvent('session',sb2,ssecs); persist();
      clearTimer(); closeSheet(); toast(sfin?t('toastFinished',{t:titleOf(sb2)}):t('toastSession',{d:durText(ssecs)})); break;
    case 'session-discard': clearTimer(); closeSheet(); break;
    case 'day': openSheet({type:'day',d:d.d}); break;
    case 'cal-prev': view.cal.m--; if(view.cal.m<0){view.cal.m=11;view.cal.y--;} renderMain(); break;
    case 'cal-next': view.cal.m++; if(view.cal.m>11){view.cal.m=0;view.cal.y++;} renderMain(); break;
    case 'pick-avatar': $('#avatarFile').click(); break;
    case 'pick-banner': $('#bannerFile').click(); break;
    case 'rm-avatar': profImg.avatar=''; try{localStorage.removeItem('marginalia.avatar');}catch(err){} renderMain(); break;
    case 'rm-banner': profImg.banner=''; try{localStorage.removeItem('marginalia.banner');}catch(err){} renderMain(); break;
    case 'cover-pick': $('#coverFile').click(); break;
    case 'cover-remove':
      if(b===undefined||!view.sheet||view.sheet.type!=='book')break;
      var bb=find(view.sheet.id); if(bb){dropCover(bb.id);bb.hasCover=false;persist();refresh();} break;
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(el){act(el.dataset.a,el.dataset);return;}
  if(e.target.id==='sheet')closeSheet();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&view.sheet)closeSheet();});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){view.q=el.value;updateResults();onQueryChange(el.value);}
  else if(el.id==='pgRange'){
    var b=view.sheet&&find(view.sheet.id); if(!b)return; var n=Number(el.value),p=Math.round(n/b.pages*100);
    $('#pgNum').value=n; $('#pgPct').textContent=p+'%'; var bar=$('#pgBar'); if(bar)bar.style.width=p+'%';
  }
});
document.addEventListener('change',function(e){
  var el=e.target,b;
  if(el.id==='pgRange'||el.id==='pgNum'){
    b=view.sheet&&find(view.sheet.id); if(!b)return;
    var fin=setPage(b,el.value); refresh(); if(fin)toast(t('toastFinished',{t:titleOf(b)}));
  }else if(el.id==='notes'){
    b=find(el.dataset.id); if(b){b.notes=el.value.slice(0,4000);persist();}
  }else if(el.id==='pgTotal'){
    b=find(el.dataset.id); var n=Math.round(Number(el.value));
    if(b&&n>0&&n<=10000){b.pages=n;if(b.page>n)b.page=n;if(b.status==='reading'&&b.page>=n){b.status='finished';b.finishedAt=dayOffset(0);logEvent('finished',b);}persist();refresh();}
  }else if(el.id==='goal'){
    var g=Math.round(Number(el.value)); if(g>0&&g<=500){state.goal=g;persist();renderMain();}
  }else if(el.id==='genreSel'){
    b=find(el.dataset.id); if(b){b.genre=el.value;persist();refresh();}
  }else if(el.id==='avatarFile'||el.id==='bannerFile'){
    var pf=el.files&&el.files[0],isAv=el.id==='avatarFile'; el.value=''; if(!pf)return;
    resizeFile(pf,isAv?256:960,isAv?256:400,0.82).then(function(url){
      try{localStorage.setItem(isAv?'marginalia.avatar':'marginalia.banner',url);}catch(err){toast(t('toastCoverErr'));return;}
      if(isAv)profImg.avatar=url;else profImg.banner=url;
      toast(t('toastPhoto')); renderMain();
    },function(){toast(t('toastCoverErr'));});
  }else if(el.id==='coverFile'){
    var f=el.files&&el.files[0]; el.value=''; if(!f||!view.sheet||view.sheet.type!=='book')return;
    var id=view.sheet.id,fr=new FileReader();
    fr.onerror=function(){toast(t('toastCoverErr'));};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){toast(t('toastCoverErr'));};
      img.onload=function(){
        var W=240,H=360,cv=document.createElement('canvas');cv.width=W;cv.height=H;
        var cx=cv.getContext('2d'),s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
        cx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
        var bk=find(id); if(!bk)return;
        saveCover(id,cv.toDataURL('image/jpeg',0.82)); bk.hasCover=true; persist(); refresh(); toast(t('toastCover'));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='customForm')return; e.preventDefault();
  var f=e.target.elements,title=f.title.value.trim(); if(!title)return;
  var author=f.author.value.trim()||t('unknownAuthor'),pages=Math.max(1,Math.min(10000,Math.round(Number(f.pages.value))||300));
  if(inLib(null,title,author)){toast(t('toastDup'));return;}
  addBook({cid:null,title:title,author:author,pages:pages,genre:f.genre.value},f.status.value);
  e.target.reset(); updateResults(); toast(t('toastAdded',{t:title}));
});

/* ================= boot ================= */
renderAll(); initCloud(); resolveMissingCovers();
})();
</script>
</body>
</html>
